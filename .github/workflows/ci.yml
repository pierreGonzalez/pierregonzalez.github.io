name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: HTML validation
        run: npm run lint
      - name: Internal links and assets
        run: npm run links
